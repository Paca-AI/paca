name: agent-runner-pr-ci

on:
  pull_request:
    paths:
      - "services/agent-runner/**"
      - ".github/workflows/agent-runner-pr-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-runner-pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.4"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint — fast feedback, no services needed
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: services/agent-runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/agent-runner/go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

  # ---------------------------------------------------------------------------
  # 2. Build — verify the binary (and every livecheck program) compiles
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: services/agent-runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/agent-runner/go.sum

      - name: Build all packages
        run: go build ./...

  # ---------------------------------------------------------------------------
  # 3. Unit tests — in-memory fakes (miniredis, httptest), no external
  #    services needed. Coverage against real Docker/Postgres/Valkey lives
  #    in this service's livecheck programs (cmd/agent-runner/livecheck*,
  #    internal/*/livecheck) instead of an automated E2E job — they're
  #    meant to be run by hand against a real dev stack (see each program's
  #    own doc comment and docs/ai-agent/goose-migration.md), not wired into
  #    CI, so there is no test-e2e job here to mirror api-pr-ci.yml's.
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: services/agent-runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/agent-runner/go.sum

      - name: Run tests (race detector)
        run: go test -race -timeout 60s -coverprofile=coverage.out ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: services/agent-runner/coverage.out
          retention-days: 7
