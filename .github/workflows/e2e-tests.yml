name: e2e-tests

# Runs the Playwright specs in apps/e2e against the dedicated E2E docker stack
# (deploy/docker-compose.e2e.yml). Manual trigger only: the stack builds every
# service from source, so a run takes a while.
on:
  workflow_dispatch:
    inputs:
      browsers:
        description: "Space-separated Playwright projects (chromium firefox webkit mobile-chrome mobile-safari)"
        required: true
        default: "chromium firefox webkit mobile-chrome mobile-safari"
      specs:
        description: "Spec paths/filters passed to `playwright test` (empty = all specs)"
        required: false
        default: ""
      workers:
        description: "Parallel workers per browser"
        required: false
        default: "2"
      build_agent_server:
        description: "Also build the paca-agent-server-goose:e2e sandbox image (large, only needed for real agent runs)"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (${{ inputs.browsers }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"

      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/e2e/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        working-directory: apps/e2e
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/e2e
        env:
          E2E_BROWSERS: ${{ inputs.browsers }}
        run: |
          engines=""
          for project in $E2E_BROWSERS; do
            case "$project" in
              chromium|mobile-chrome) engines="$engines chromium" ;;
              firefox) engines="$engines firefox" ;;
              webkit|mobile-safari) engines="$engines webkit" ;;
              *) echo "Unknown Playwright project: $project" >&2; exit 1 ;;
            esac
          done
          engines=$(echo $engines | tr ' ' '\n' | sort -u | tr '\n' ' ')
          bunx playwright install --with-deps $engines

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build agent-server sandbox image
        if: ${{ inputs.build_agent_server }}
        run: |
          docker build \
            -f services/agent-server/Dockerfile \
            -t paca-agent-server-goose:e2e \
            services/agent-server

      - name: Start E2E stack
        run: |
          # The plugin stores are gitignored; create them so the bind mounts
          # are owned by the runner user rather than created as root by Docker.
          mkdir -p plugins/local/{backend,frontend,mcp,skills}
          docker compose -f deploy/docker-compose.e2e.yml up -d --build --wait

      - name: Run Playwright tests
        working-directory: apps/e2e
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost
          E2E_BROWSERS: ${{ inputs.browsers }}
          E2E_WORKERS: ${{ inputs.workers }}
          E2E_SPECS: ${{ inputs.specs }}
        # Browsers run one after another (they must never share the stack at
        # the same time — see scripts/test-all.sh), each into its own report
        # folder so later runs do not overwrite earlier ones. E2E_SPECS is
        # left unquoted on purpose so several paths split into args.
        run: |
          status=0
          for project in $E2E_BROWSERS; do
            echo "==> $project"
            PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report/$project" PLAYWRIGHT_HTML_OPEN=never \
              bunx playwright test --project="$project" --output="test-results/$project" $E2E_SPECS || status=1
          done
          exit $status

      - name: Dump stack logs
        if: failure()
        run: docker compose -f deploy/docker-compose.e2e.yml logs --no-color > e2e-stack.log 2>&1 || true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
            e2e-stack.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down E2E stack
        if: always()
        run: docker compose -f deploy/docker-compose.e2e.yml down -v
