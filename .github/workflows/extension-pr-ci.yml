name: extension-pr-ci

on:
  pull_request:
    paths:
      - "apps/extension/**"
      - ".github/workflows/extension-pr-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extension-quality:
    name: Lint and build browser extension
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/extension

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Biome lint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build
