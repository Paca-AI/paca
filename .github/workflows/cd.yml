name: cd

# Triggered when a GitHub Release is published (draft → published or created as
# published).  Each job builds one artefact and pushes it to the appropriate
# GitHub registry and DockerHub so that self-hosters can pull pre-built images/packages.
#
# Artefacts produced per release:
#   ghcr.io/paca-ai/paca-api:<tag>        — Go API service Docker image
#   <dockerhub-username>/paca-api:<tag>   — Go API service Docker image
#   ghcr.io/paca-ai/paca-realtime:<tag>   — Node realtime service Docker image
#   <dockerhub-username>/paca-realtime:<tag> — Node realtime service Docker image
#   ghcr.io/paca-ai/paca-web:<tag>        — Web app Docker image (Caddy)
#   <dockerhub-username>/paca-web:<tag>   — Web app Docker image (Caddy)
#   ghcr.io/paca-ai/paca-agent-runner:<tag>   — Agent Runner service Docker image (Go; replaces the old Python "ai-agent")
#   <dockerhub-username>/paca-agent-runner:<tag> — Agent Runner service Docker image
#   ghcr.io/paca-ai/paca-agent-server-goose:<tag>   — Sandbox image (Goose + Paca MCP pre-installed)
#   <dockerhub-username>/paca-agent-server-goose:<tag> — Sandbox image (Goose + Paca MCP pre-installed)
#   oci://ghcr.io/paca-ai/charts/paca:<tag> — Helm chart (deploy/helm/paca), pushed as an
#     OCI artifact so it can be added to Artifact Hub as a "Helm charts (OCI)" repository —
#     see the helm-chart job below for why OCI instead of a gh-pages index.yaml. Registering
#     oci://ghcr.io/paca-ai/charts/paca with Artifact Hub itself is a one-time manual step on
#     https://artifacthub.io/control-panel/repositories, not something this workflow can do.
#   oci://ghcr.io/paca-ai/charts/paca:artifacthub.io — Artifact Hub repository metadata
#     (deploy/helm/paca/artifacthub-repo.yml), lets Artifact Hub mark the repo "verified
#     publisher" once its repositoryID matches the one registered above.
#   registry.npmjs.org @paca-ai/paca-mcp — MCP server npm package
#   registry.npmjs.org @paca-ai/plugin-sdk-react — Plugin frontend SDK npm package
#   GitHub Release assets:
#     install.sh         — one-shot interactive install script
#     upgrade.sh         — upgrades an existing installation in place
#     docker-compose.yml — standalone compose (no source tree required)
#     Caddyfile          — Caddy gateway configuration
#     .env.production.example — environment variable template
#     install-acp-bridge.sh — installs the paca-acp-bridge binary below
#     paca-acp-bridge_<version>_<os>_<arch>.{tar.gz,zip} — ACP bridge local
#       daemon (Go binary; end users run this on their own machine, so it
#       ships as release assets rather than a Docker image)
#     paca-extension.zip — pre-built Chrome extension (unpacked); not on the
#       Chrome Web Store (see build-extension job below for why), so this
#       fixed-name zip is what apps/extension/README.md's install steps
#       point users at, same as install.sh/docker-compose.yml above
#
# "Latest" tag sequencing (promote-release, the last job below): no image is
# pushed with a :latest Docker tag until every job in this workflow has
# succeeded, so :latest keeps pointing at the previous, fully-shipped release
# for the whole ~20-30 minute build window instead of a half-published one.
# install.sh/upgrade.sh are also stamped with this exact release's tag as
# their default target, so a plain `bash install.sh` never depends on the
# :latest tag being current.
#
# The GitHub release page itself is NOT held back the same way: GitHub marks
# a release "Latest" (and /releases/latest resolves to it) the instant it's
# published, before this workflow even starts, and there is no reliable way
# to make that not so (see git history of this file for why the previous
# hold-release-label job that tried was removed — `--latest=false` on the
# just-published release doesn't actually demote it). So for the whole build
# window, the release page can say "Latest" while its Docker images are still
# on the old :latest tag and /releases/latest/download/* still 404s. Keep
# that in mind when publishing: the release isn't actually ready just because
# GitHub calls it "Latest".

on:
  release:
    types: [published]

# All jobs need read on contents (checkout) and write on packages (push/publish).
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # API service image
  # ─────────────────────────────────────────────────────────────────────────────
  api-image:
    name: Build and push API image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/paca-api
            ${{ secrets.DOCKERHUB_USERNAME }}/paca-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: services/api
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PACA_VERSION=${{ github.event.release.tag_name }}
            GOMAXPROCS=4
            GOMEMLIMIT=6GiB
            GOBUILD_P=4
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # Realtime service image
  # ─────────────────────────────────────────────────────────────────────────────
  realtime-image:
    name: Build and push Realtime image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/paca-realtime
            ${{ secrets.DOCKERHUB_USERNAME }}/paca-realtime
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: services/realtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # Web app image
  # ─────────────────────────────────────────────────────────────────────────────
  # The pre-built image uses relative URLs that work with the Caddy /api
  # proxy out of the box, since the API client now derives the base URL
  # from window.location.origin at runtime.
  web-image:
    name: Build and push Web image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/paca-web
            ${{ secrets.DOCKERHUB_USERNAME }}/paca-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # Agent Runner service image (Go — replaces the old Python "ai-agent")
  # ─────────────────────────────────────────────────────────────────────────────
  agent-runner-image:
    name: Build and push Agent Runner image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/paca-agent-runner
            ${{ secrets.DOCKERHUB_USERNAME }}/paca-agent-runner
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: services/agent-runner
          file: services/agent-runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # Agent-server sandbox image (Goose + Paca MCP pre-installed). Must be
  # built from services/agent-server/Dockerfile specifically — the raw
  # upstream Goose image has no Node.js, so the Paca MCP server can never
  # start in it.
  # ─────────────────────────────────────────────────────────────────────────────
  agent-server-goose-image:
    name: Build and push Agent Server (Goose) image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/paca-agent-server-goose
            ${{ secrets.DOCKERHUB_USERNAME }}/paca-agent-server-goose
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: services/agent-server
          file: services/agent-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # Helm chart → ghcr.io as an OCI artifact
  #
  # Pushed OCI-native (`helm push oci://...`) rather than the more common
  # gh-pages/index.yaml layout, because every other artefact this workflow
  # produces already lives under ghcr.io/paca-ai — this keeps the chart in
  # the same place instead of standing up a second, differently-shaped
  # publishing path (GitHub Pages, a gh-pages branch, chart-releaser-action).
  # Artifact Hub's "Helm charts (OCI)" repository kind reads this directly;
  # each chart needs its own OCI ref (one repository entry per chart on
  # Artifact Hub's side), hence .../charts/paca rather than a shared charts/
  # index the way the index.yaml layout would allow.
  #
  # Deliberately no :latest tag here unlike the Docker images above — OCI
  # Helm repos are versioned through each immutable semver tag (Artifact Hub
  # reads the version straight out of Chart.yaml/the tag, not a floating
  # pointer), so a :latest tag would just be unused noise.
  # ─────────────────────────────────────────────────────────────────────────────
  helm-chart:
    name: Package and push Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      # Needed for cosign's keyless signing below — it exchanges this job's
      # OIDC token for a short-lived cert from Sigstore's Fulcio instead of
      # a stored private key.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint deploy/helm/paca

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} --password-stdin

      # Chart.yaml's own version/appVersion stay at their checked-in
      # placeholders for local dev (helm lint/template need no release tag to
      # run) — this release's real version is stamped on here instead, the
      # same way build-acp-bridge/publish-mcp strip the leading "v" from the
      # tag rather than editing a checked-in version field.
      - name: Package chart
        run: |
          set -euo pipefail
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"

          # Pin the five paca-built images to this release before
          # packaging — values.yaml checks in "latest" for local dev, but
          # a versioned chart install must not depend on whatever :latest
          # happens to point at (promote-release above only retags
          # :latest once this job has already succeeded, so it can be
          # ahead or behind the release being installed). Postgres/
          # valkey/minio/caddy tags are real pinned upstream versions and
          # are deliberately left untouched.
          for repo in paca-api paca-web paca-realtime paca-agent-runner paca-agent-server-goose; do
            sed -i "/repository: ghcr.io\/paca-ai\/${repo}\$/{n;s/tag: \"latest\"/tag: \"${VERSION}\"/}" \
              deploy/helm/paca/values.yaml
          done

          mkdir -p dist
          helm package deploy/helm/paca \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist

      - name: Push chart
        run: |
          set -euo pipefail
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          helm push "dist/paca-${VERSION}.tgz" oci://${{ env.REGISTRY }}/paca-ai/charts

      # Lets Artifact Hub mark this repository as a "verified publisher" —
      # it proves control over the OCI ref by matching the repositoryID
      # here against the one shown in Artifact Hub's control panel for
      # oci://ghcr.io/paca-ai/charts/paca. Pushed under the fixed
      # "artifacthub.io" tag that Artifact Hub looks for, separate from
      # the chart's own version tags above.
      - name: Set up oras
        uses: oras-project/setup-oras@v1

      # oras reads credentials from the Docker config, not Helm's registry
      # config that "Log in to GitHub Container Registry" above wrote to —
      # the two CLIs don't share credential storage, so oras needs its own
      # login or the push goes out anonymous and GHCR rejects it with 401.
      - name: Log in to GHCR with oras
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} --password-stdin

      # Resolved once here and signed by digest below rather than by tag —
      # tags are mutable, so cosign's own guidance is to sign the immutable
      # digest a tag happened to resolve to at push time, not the tag itself.
      - name: Resolve chart digest
        run: |
          set -euo pipefail
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          DIGEST=$(oras resolve "${{ env.REGISTRY }}/paca-ai/charts/paca:${VERSION}")
          echo "digest=${DIGEST}" >> "$GITHUB_ENV"

      # Keyless signing (no key material to generate/store/rotate): cosign
      # trades this job's GitHub OIDC token for a short-lived cert from
      # Sigstore's Fulcio, signs with that, and records the signature in
      # Rekor's transparency log. Artifact Hub's OCI Helm tracker checks
      # for exactly this — see HasCosignSignature in artifacthub/hub. Runs
      # after the oras login above since cosign reads the same Docker
      # credential store oras does (not Helm's registry config).
      #
      # cosign-release is pinned so the exact signing binary is
      # reproducible between runs — every run writes a permanent entry to
      # Rekor's public transparency log, so an unpinned, drifting cosign
      # version would make those log entries harder to reason about after
      # the fact.
      # @v4.1.2, not the floating @v3 major tag: @v3's installer script only
      # knows how to verify the legacy .sig/.pem scheme cosign itself
      # dropped after v3.0.0 (releases now ship a .sigstore.json bundle
      # instead) — pinning cosign-release below to a 3.x release with an
      # installer that still expects a .sig file 404s trying to fetch one.
      # No floating @v4 tag exists yet for this action, only exact ones.
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Sign chart with cosign
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/paca-ai/charts/paca@${{ env.digest }}"

      - name: Push Artifact Hub repository metadata
        run: |
          oras push ${{ env.REGISTRY }}/paca-ai/charts/paca:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            deploy/helm/paca/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

  # ─────────────────────────────────────────────────────────────────────────────
  # MCP server npm package → npmjs.com
  # ─────────────────────────────────────────────────────────────────────────────
  publish-mcp:
    name: Publish MCP package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: apps/mcp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"

      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-mcp-${{ hashFiles('apps/mcp/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-mcp-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Strip the leading 'v' from the release tag (v1.2.3 → 1.2.3) so it
      # matches npm's semver format, then stamp package.json without a git tag.
      # Must run BEFORE build so the version is baked into build/package.json.
      - name: Set package version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          npm version "${VERSION#v}" --no-git-tag-version

      - name: Build
        run: bun run build

      - name: Setup Node.js with npm registry
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@paca-ai"

      # npm 12.0.0 has a packaging bug: libnpmpublish still requires
      # `sigstore`, but the published 12.0.0 tarball is missing that
      # module, so `npm publish --provenance` crashes with "Cannot find
      # module 'sigstore'". Pin to the 11.x line until a patched 12.x
      # ships. See https://github.com/npm/cli/issues/9722.
      - name: Upgrade npm
        run: npm install -g npm@11

      # For prerelease versions (e.g. 1.0.0-alpha.1), npm requires an explicit
      # --tag to avoid accidentally tagging as "latest".
      - name: Publish to npm
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          CLEAN_VERSION="${VERSION#v}"
          if [[ "$CLEAN_VERSION" == *"-"* ]]; then
            PRERELEASE_LABEL=$(echo "$CLEAN_VERSION" | sed 's/[^-]*-\([a-zA-Z]*\).*/\1/')
            npm publish --provenance --access public --tag "${PRERELEASE_LABEL:-next}"
          else
            npm publish --provenance --access public
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # ACP bridge Go binary → GitHub Release assets
  #
  # apps/acp-bridge is a CLI end users run on their own machine, not a
  # service Paca deploys — unlike every Docker-image job above, it ships as
  # cross-compiled binaries attached directly to this release rather than a
  # container. scripts/install-acp-bridge.sh (built and uploaded by the
  # "Deployment assets" job below, right alongside install.sh/upgrade.sh)
  # is what the "Install the ACP bridge" step in Paca's Agents UI actually
  # tells users to run; it detects the caller's OS/arch and downloads
  # whichever archive this job produced matches.
  # ─────────────────────────────────────────────────────────────────────────────
  build-acp-bridge:
    name: Build ACP bridge (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release upload

    defaults:
      run:
        working-directory: apps/acp-bridge

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache-dependency-path: apps/acp-bridge/go.sum

      # Strip the leading 'v' from the release tag (v1.2.3 → 1.2.3) so the
      # binary's own `paca-acp-bridge version` output — and the archive name
      # below — matches every other artefact's version format.
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          BINARY="paca-acp-bridge"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY="paca-acp-bridge.exe"
          fi
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/${BINARY}" ./cmd/paca-acp-bridge

      # tar.gz for macOS/Linux, zip for Windows — matches what each
      # platform's users actually expect to extract.
      - name: Package archive
        id: package
        run: |
          set -euo pipefail
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          NAME="paca-acp-bridge_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "../${NAME}.zip" paca-acp-bridge.exe
            echo "asset=${NAME}.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "../${NAME}.tar.gz" paca-acp-bridge
            echo "asset=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload archive to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.package.outputs.asset }}" --clobber

  # ─────────────────────────────────────────────────────────────────────────────
  # Browser extension → GitHub Release asset
  #
  # apps/extension is loaded as an unpacked directory in Chrome rather than
  # published to the Chrome Web Store — it needs <all_urls> host permissions
  # to work against any self-hosted Paca instance (the hostname can't be
  # known in advance), which doesn't fit through the Store's review model.
  # So this just zips the build output and attaches it as a fixed-name
  # release asset, same pattern as install.sh/docker-compose.yml below, so
  # /releases/latest/download/paca-extension.zip is a stable URL end users
  # can download and unzip without cloning the repo or installing Node. See
  # apps/extension/README.md for the full install steps.
  # ─────────────────────────────────────────────────────────────────────────────
  build-extension:
    name: Build browser extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release upload

    defaults:
      run:
        working-directory: apps/extension

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Zips a named paca-extension/ directory (copied from dist/) rather
      # than dist/'s contents directly, so extracting the archive always
      # yields a paca-extension/ folder to point "Load unpacked" at,
      # regardless of which unzip tool a user's OS reaches for.
      - name: Package archive
        run: |
          set -euo pipefail
          cp -r dist paca-extension
          zip -r paca-extension.zip paca-extension

      - name: Upload archive to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            paca-extension.zip --clobber

  # ─────────────────────────────────────────────────────────────────────────────
  # Deployment assets → GitHub Release
  #
  # Uploads four files so that users can run or upgrade Paca without cloning the repo:
  #   install.sh         — interactive setup wizard (download + configure + start)
  #   upgrade.sh         — upgrades an existing installation in place
  #   docker-compose.yml — standalone compose referencing pre-built DockerHub images
  #   Caddyfile          — Caddy gateway configuration required by the compose file
  #
  # End-users download and run:
  #   curl -fsSL https://github.com/Paca-AI/paca/releases/latest/download/install.sh -o install.sh
  #   bash install.sh
  #
  # Waits for every image/package job so these assets — and the exact version
  # they're stamped with below — are never uploaded for a release that isn't
  # fully shippable. If any of those jobs fail, this job is skipped, so
  # /releases/latest/download/* keeps 404ing on this release's assets even
  # though GitHub already labeled it "Latest" at publish time (see the note
  # at the top of this file) until the underlying issue is fixed.
  # ─────────────────────────────────────────────────────────────────────────────
  release-assets:
    name: Upload deployment assets to release
    runs-on: ubuntu-latest
    needs:
      [
        api-image,
        realtime-image,
        web-image,
        agent-runner-image,
        agent-server-goose-image,
        helm-chart,
        publish-mcp,
        build-acp-bridge,
        build-extension,
      ]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare assets
        run: |
          # Rename files to the names end-users will download.
          cp deploy/docker-compose.prod.yml        docker-compose.yml
          cp deploy/caddy/Caddyfile                Caddyfile
          cp deploy/.env.production.example        .env.production.example
          cp scripts/install.sh                    install.sh
          cp scripts/upgrade.sh                    upgrade.sh
          cp scripts/install-acp-bridge.sh         install-acp-bridge.sh
          chmod +x install.sh upgrade.sh install-acp-bridge.sh

          # Stamp this release's own tag as the scripts' default version. A
          # plain `bash install.sh` / `bash upgrade.sh` / `bash
          # install-acp-bridge.sh` downloaded from this release then pins to
          # a version that's guaranteed to exist, instead of the floating
          # :latest tag, which promote-release only updates once this job
          # has already succeeded. Targets the single
          # `PACA_DEFAULT_VERSION="latest"` line each script keeps for
          # exactly this purpose — see the comment above it in install.sh /
          # upgrade.sh / install-acp-bridge.sh before changing this pattern.
          VERSION="${{ github.event.release.tag_name }}"
          sed -i "s/^PACA_DEFAULT_VERSION=\"latest\"$/PACA_DEFAULT_VERSION=\"${VERSION}\"/" \
            install.sh upgrade.sh install-acp-bridge.sh

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            install.sh \
            upgrade.sh \
            install-acp-bridge.sh \
            docker-compose.yml \
            Caddyfile \
            .env.production.example \
            --clobber

  # ─────────────────────────────────────────────────────────────────────────────
  # Promote release to "Latest"
  #
  # Runs only once every image/package job AND release-assets have succeeded,
  # so this never fires for a partially-shipped release. Skipped entirely for
  # pre-releases, which should never become the default install/upgrade
  # target. Two things happen together here, deliberately in the same job:
  #   1. Every image gets a :latest tag pointing at this version's manifest,
  #      via `imagetools create` (a registry-side copy, no rebuild needed).
  #   2. The GitHub release is (re-)marked "Latest". GitHub already marked it
  #      "Latest" at publish time regardless (see the note at the top of this
  #      file), so this step is a no-op on the happy path — it only matters
  #      if this specific release ever needs re-promoting after a fix.
  # Tags before label so /releases/latest never resolves to a release whose
  # :latest images aren't there yet, for the (now purely cosmetic) window
  # where this step hasn't run.
  # ─────────────────────────────────────────────────────────────────────────────
  promote-release:
    name: Promote release to "Latest"
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease }}
    needs:
      [
        api-image,
        realtime-image,
        web-image,
        agent-runner-image,
        agent-server-goose-image,
        helm-chart,
        publish-mcp,
        build-acp-bridge,
        build-extension,
        release-assets,
      ]
    permissions:
      contents: write
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Retag images as :latest
        run: |
          set -euo pipefail
          VERSION="${{ github.event.release.tag_name }}"
          TAG="${VERSION#v}"
          # ghcr.io repository paths must be lowercase. github.repository_owner
          # preserves the org's display casing (Paca-AI), which fails here, so
          # hardcode the lowercase form instead of deriving it at runtime.
          OWNER="paca-ai"
          for image in paca-api paca-realtime paca-web paca-agent-runner paca-agent-server-goose; do
            docker buildx imagetools create \
              -t "${{ env.REGISTRY }}/${OWNER}/${image}:latest" \
              "${{ env.REGISTRY }}/${OWNER}/${image}:${TAG}"
            docker buildx imagetools create \
              -t "${{ secrets.DOCKERHUB_USERNAME }}/${image}:latest" \
              "${{ secrets.DOCKERHUB_USERNAME }}/${image}:${TAG}"
          done

      - name: Mark release as "Latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release edit "$TAG_NAME" --repo "${{ github.repository }}" --latest
