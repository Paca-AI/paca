name: cd

# Triggered when a GitHub Release is published (draft → published or created as
# published).  Each job builds one artefact and pushes it to the appropriate
# GitHub registry and DockerHub so that self-hosters can pull pre-built images/packages.
#
# Artefacts produced per release:
#   ghcr.io/paca-ai/paca-api:<tag>        — Go API service Docker image
#   <dockerhub-username>/paca-api:<tag>   — Go API service Docker image
#   ghcr.io/paca-ai/paca-realtime:<tag>   — Node realtime service Docker image
#   <dockerhub-username>/paca-realtime:<tag> — Node realtime service Docker image
#   ghcr.io/paca-ai/paca-web:<tag>        — Web app Docker image (Caddy)
#   <dockerhub-username>/paca-web:<tag>   — Web app Docker image (Caddy)
#   ghcr.io/paca-ai/paca-ai-agent:<tag>   — AI Agent service Docker image
#   <dockerhub-username>/paca-ai-agent:<tag> — AI Agent service Docker image
#   ghcr.io/paca-ai/paca-agent-server:<tag>   — Sandbox agent-server image (OpenHands + Paca MCP pre-installed)
#   <dockerhub-username>/paca-agent-server:<tag> — Sandbox agent-server image (OpenHands + Paca MCP pre-installed)
#   registry.npmjs.org @paca-ai/paca-mcp — MCP server npm package
#   registry.npmjs.org @paca-ai/plugin-sdk-react — Plugin frontend SDK npm package
#   pypi.org paca-acp-bridge — ACP bridge local daemon Python package
#   GitHub Release assets:
#     install.sh         — one-shot interactive install script
#     upgrade.sh         — upgrades an existing installation in place
#     docker-compose.yml — standalone compose (no source tree required)
#     Caddyfile          — Caddy gateway configuration
#     .env.production.example — environment variable template
#
# "Latest" label sequencing (hold-release-label / promote-release below):
# no image is pushed with a :latest Docker tag, and the GitHub release itself
# is held off the "Latest" release marker, until every job in this workflow
# has succeeded. This keeps /releases/latest and every :latest image tag
# pointing at the previous, fully-shipped release for the whole ~20-30 minute
# build window instead of a half-published one. install.sh/upgrade.sh are
# also stamped with this exact release's tag as their default target, so a
# plain `bash install.sh` never depends on the :latest tag being current.

on:
  release:
    types: [published]

# All jobs need read on contents (checkout) and write on packages (push/publish).
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Hold the "Latest" release label until every artefact has actually shipped
  # ─────────────────────────────────────────────────────────────────────────────
  # GitHub marks a newly published release "Latest" (and /releases/latest
  # resolves to it) immediately on publish by default. This workflow takes
  # 20-30 minutes, so during that window /releases/latest/download/* would
  # 404 (release-assets hasn't run yet) and any :latest Docker pull would
  # still be fine (see below) but the release page itself would look "live"
  # before it is. Demote it back to no label here — promote-release (the
  # last job in this file) re-marks it "Latest" only once everything below
  # has succeeded.
  hold-release-label:
    name: Hold "Latest" label until release is complete
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Unmark this release as "Latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release edit "$TAG_NAME" --repo "${{ github.repository }}" --latest=false

  # ─────────────────────────────────────────────────────────────────────────────
  # API service image
  # ─────────────────────────────────────────────────────────────────────────────
  api-image:
    name: Build and push API image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/paca-api
            ${{ secrets.DOCKERHUB_USERNAME }}/paca-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: services/api
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PACA_VERSION=${{ github.event.release.tag_name }}
            GOMAXPROCS=4
            GOMEMLIMIT=6GiB
            GOBUILD_P=4
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # Realtime service image
  # ─────────────────────────────────────────────────────────────────────────────
  realtime-image:
    name: Build and push Realtime image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/paca-realtime
            ${{ secrets.DOCKERHUB_USERNAME }}/paca-realtime
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: services/realtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # Web app image
  # ─────────────────────────────────────────────────────────────────────────────
  # The pre-built image uses relative URLs that work with the Caddy /api
  # proxy out of the box, since the API client now derives the base URL
  # from window.location.origin at runtime.
  web-image:
    name: Build and push Web image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/paca-web
            ${{ secrets.DOCKERHUB_USERNAME }}/paca-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # AI Agent service image
  # ─────────────────────────────────────────────────────────────────────────────
  ai-agent-image:
    name: Build and push AI Agent image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/paca-ai-agent
            ${{ secrets.DOCKERHUB_USERNAME }}/paca-ai-agent
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: services/ai-agent
          file: services/ai-agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # Agent-server sandbox image (OpenHands agent-server + Paca MCP pre-installed)
  # ─────────────────────────────────────────────────────────────────────────────
  agent-server-image:
    name: Build and push Agent Server image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/paca-agent-server
            ${{ secrets.DOCKERHUB_USERNAME }}/paca-agent-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: services/agent-server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # MCP server npm package → npmjs.com
  # ─────────────────────────────────────────────────────────────────────────────
  publish-mcp:
    name: Publish MCP package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: apps/mcp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"

      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-mcp-${{ hashFiles('apps/mcp/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-mcp-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Strip the leading 'v' from the release tag (v1.2.3 → 1.2.3) so it
      # matches npm's semver format, then stamp package.json without a git tag.
      # Must run BEFORE build so the version is baked into build/package.json.
      - name: Set package version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          npm version "${VERSION#v}" --no-git-tag-version

      - name: Build
        run: bun run build

      - name: Setup Node.js with npm registry
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@paca-ai"

      # npm 12.0.0 has a packaging bug: libnpmpublish still requires
      # `sigstore`, but the published 12.0.0 tarball is missing that
      # module, so `npm publish --provenance` crashes with "Cannot find
      # module 'sigstore'". Pin to the 11.x line until a patched 12.x
      # ships. See https://github.com/npm/cli/issues/9722.
      - name: Upgrade npm
        run: npm install -g npm@11

      # For prerelease versions (e.g. 1.0.0-alpha.1), npm requires an explicit
      # --tag to avoid accidentally tagging as "latest".
      - name: Publish to npm
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          CLEAN_VERSION="${VERSION#v}"
          if [[ "$CLEAN_VERSION" == *"-"* ]]; then
            PRERELEASE_LABEL=$(echo "$CLEAN_VERSION" | sed 's/[^-]*-\([a-zA-Z]*\).*/\1/')
            npm publish --provenance --access public --tag "${PRERELEASE_LABEL:-next}"
          else
            npm publish --provenance --access public
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # ACP bridge Python package → pypi.org
  # ─────────────────────────────────────────────────────────────────────────────
  publish-acp-bridge:
    name: Publish ACP bridge package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Required for PyPI Trusted Publishing (OIDC) — no stored API token needed.
      id-token: write

    defaults:
      run:
        working-directory: apps/acp-bridge

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # Strip the leading 'v' from the release tag (v1.2.3 → 1.2.3) so it
      # matches PyPI's version format, then stamp pyproject.toml without
      # touching uv.lock. Must run BEFORE build so the version is baked
      # into the built sdist/wheel.
      - name: Set package version
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: uv version --frozen "${VERSION#v}"

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  # ─────────────────────────────────────────────────────────────────────────────
  # Deployment assets → GitHub Release
  #
  # Uploads four files so that users can run or upgrade Paca without cloning the repo:
  #   install.sh         — interactive setup wizard (download + configure + start)
  #   upgrade.sh         — upgrades an existing installation in place
  #   docker-compose.yml — standalone compose referencing pre-built DockerHub images
  #   Caddyfile          — Caddy gateway configuration required by the compose file
  #
  # End-users download and run:
  #   curl -fsSL https://github.com/Paca-AI/paca/releases/latest/download/install.sh -o install.sh
  #   bash install.sh
  #
  # Waits for every image/package job so these assets — and the exact version
  # they're stamped with below — are never uploaded for a release that isn't
  # fully shippable. If any of those jobs fail, this job is skipped and the
  # previous release (still the "Latest" one; see hold-release-label /
  # promote-release) keeps serving installs/upgrades until it's fixed.
  # ─────────────────────────────────────────────────────────────────────────────
  release-assets:
    name: Upload deployment assets to release
    runs-on: ubuntu-latest
    needs:
      [
        api-image,
        realtime-image,
        web-image,
        ai-agent-image,
        agent-server-image,
        publish-mcp,
        publish-acp-bridge,
      ]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare assets
        run: |
          # Rename files to the names end-users will download.
          cp deploy/docker-compose.prod.yml        docker-compose.yml
          cp deploy/caddy/Caddyfile                Caddyfile
          cp deploy/.env.production.example        .env.production.example
          cp scripts/install.sh                    install.sh
          cp scripts/upgrade.sh                    upgrade.sh
          chmod +x install.sh upgrade.sh

          # Stamp this release's own tag as the scripts' default version. A
          # plain `bash install.sh` / `bash upgrade.sh` downloaded from this
          # release then pins to a version that's guaranteed to exist,
          # instead of the floating :latest Docker tag, which promote-release
          # only updates once this job has already succeeded. Targets the
          # single `PACA_DEFAULT_VERSION="latest"` line each script keeps for
          # exactly this purpose — see the comment above it in install.sh /
          # upgrade.sh before changing this pattern.
          VERSION="${{ github.event.release.tag_name }}"
          sed -i "s/^PACA_DEFAULT_VERSION=\"latest\"$/PACA_DEFAULT_VERSION=\"${VERSION}\"/" install.sh upgrade.sh

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            install.sh \
            upgrade.sh \
            docker-compose.yml \
            Caddyfile \
            .env.production.example \
            --clobber

  # ─────────────────────────────────────────────────────────────────────────────
  # Promote release to "Latest"
  #
  # Runs only once every image/package job AND release-assets have succeeded,
  # so this never fires for a partially-shipped release. Skipped entirely for
  # pre-releases, which should never become the default install/upgrade
  # target. Two things happen together here, deliberately in the same job:
  #   1. Every image gets a :latest tag pointing at this version's manifest,
  #      via `imagetools create` (a registry-side copy, no rebuild needed).
  #   2. The GitHub release is marked "Latest" (undoing hold-release-label),
  #      so /releases/latest/download/* starts serving this release's assets.
  # Reversing the order (label first, tags second) would let /releases/latest
  # briefly resolve to a release whose :latest images aren't there yet.
  # ─────────────────────────────────────────────────────────────────────────────
  promote-release:
    name: Promote release to "Latest"
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease }}
    needs:
      [
        hold-release-label,
        api-image,
        realtime-image,
        web-image,
        ai-agent-image,
        agent-server-image,
        publish-mcp,
        publish-acp-bridge,
        release-assets,
      ]
    permissions:
      contents: write
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Retag images as :latest
        run: |
          set -euo pipefail
          VERSION="${{ github.event.release.tag_name }}"
          TAG="${VERSION#v}"
          for image in paca-api paca-realtime paca-web paca-ai-agent paca-agent-server; do
            docker buildx imagetools create \
              -t "${{ env.REGISTRY }}/${{ toLower(github.repository_owner) }}/${image}:latest" \
              "${{ env.REGISTRY }}/${{ toLower(github.repository_owner) }}/${image}:${TAG}"
            docker buildx imagetools create \
              -t "${{ secrets.DOCKERHUB_USERNAME }}/${image}:latest" \
              "${{ secrets.DOCKERHUB_USERNAME }}/${image}:${TAG}"
          done

      - name: Mark release as "Latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release edit "$TAG_NAME" --repo "${{ github.repository }}" --latest
