# Gerado para EasyPanel (Compose): Caddyfile embutido como config,
# sem portas de host (Traefik roteia), sem ai-agent/db-backup.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paca}
      POSTGRES_USER: ${POSTGRES_USER:-paca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-paca} -d ${POSTGRES_DB:-paca}
      interval: 10s
      timeout: 5s
      retries: 10
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --appendonly yes
    volumes:
    - valkey_data:/data
    healthcheck:
      test:
      - CMD
      - valkey-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
    - minio_data:/data
    healthcheck:
      test:
      - CMD
      - mc
      - ready
      - local
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    image: ${PACA_API_IMAGE:-pacaai/paca-api:latest}
    restart: unless-stopped
    environment:
      ENV: ${ENVIRONMENT:-production}
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-paca}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-paca}?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://valkey:6379/0}
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required \u2014 set it in your .env file}"
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168h}
      JWT_REFRESH_SESSION_TTL: ${JWT_REFRESH_SESSION_TTL:-24h}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required \u2014 set it in your .env file}"
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-minio:9000}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost/storage}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-paca}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-minioadmin}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-minioadmin}
      STORAGE_USE_SSL: ${STORAGE_USE_SSL:-false}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      PLUGINS_WASM_DIR: /plugins
      PLUGINS_FRONTEND_DIR: /plugins-frontend
      PLUGINS_MCP_DIR: /plugins-mcp
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      PACA_VERSION: ${PACA_VERSION:-dev}
      RELEASE_UPSTREAM_REPO: ${RELEASE_UPSTREAM_REPO:-Paca-AI/paca}
      RELEASE_FORK_REPO: ${RELEASE_FORK_REPO:-}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:8080/api/healthz
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    volumes:
    - backend_plugins:/plugins
    - frontend_plugins:/plugins-frontend
    - mcp_plugins:/plugins-mcp
  web:
    image: ${PACA_WEB_IMAGE:-pacaai/paca-web:latest}
    restart: unless-stopped
    depends_on:
    - api
  realtime:
    image: ${PACA_REALTIME_IMAGE:-pacaai/paca-realtime:latest}
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: ${ENVIRONMENT:-production}
      API_URL: http://api:8080
      REDIS_URL: ${REDIS_URL:-redis://valkey:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS:-${PUBLIC_URL:-http://localhost}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      valkey:
        condition: service_healthy
      api:
        condition: service_healthy
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
    - frontend_plugins:/var/www/plugins:ro
    - mcp_plugins:/var/www/plugins-mcp:ro
    - caddy_data:/data
    - caddy_config:/config
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
      realtime:
        condition: service_started
    configs:
    - source: caddyfile
      target: /etc/caddy/Caddyfile
    expose:
    - '80'
volumes:
  postgres_data: null
  valkey_data: null
  minio_data: null
  backend_plugins: null
  frontend_plugins: null
  mcp_plugins: null
  caddy_data: null
  caddy_config: null
configs:
  caddyfile:
    content: "# =============================================================================\n# Gateway Caddy configuration\n\
      # =============================================================================\n#\n# Single public entrypoint for the\
      \ Paca stack:\n#\n#   /api/*         \u2192  REST API service       (forwarded as-is, /api kept)\n#   /ws/*        \
      \  \u2192  Realtime service        (Socket.IO, /ws stripped)\n#   /storage/*     \u2192  MinIO                   (/storage\
      \ stripped)\n#   /plugins/*     \u2192  Plugin frontend assets  (static files)\n#   /plugins-mcp/* \u2192  Plugin MCP\
      \ bundles      (static files)\n#   /*             \u2192  Web application         (SPA with client-side routing)\n#\n\
      # This file is mounted at /etc/caddy/Caddyfile inside the gateway container.\n#\n# SITE_ADDRESS controls automatic HTTPS\n\
      # ---------------------------------------\n#   - A bare port (the default, \":80\") serves plain HTTP with no TLS at\
      \ all.\n#     Caddy can't safely provision a certificate for an unbounded catch-all\n#     address, so use this only\
      \ when something else terminates TLS in front\n#     of this gateway.\n#   - Any concrete address \u2014 a domain name,\
      \ an IP address, \"localhost\", a\n#     \"*.localhost\" name, etc. \u2014 gets HTTPS automatically:\n#       \u2022\
      \ A real domain name with DNS already pointed here (e.g.\n#         \"paca.example.com\") gets a trusted Let's Encrypt\
      \ certificate,\n#         renewed automatically. Ports 80 and 443 must both be reachable\n#         from the internet\
      \ for the ACME challenge to succeed.\n#       \u2022 Anything else (an IP address, \"localhost\", \"*.localhost\", ...)\n\
      #         gets a certificate from Caddy's own local certificate authority\n#         instead. Traffic is still encrypted,\
      \ but browsers will show a\n#         trust warning since that CA isn't publicly trusted.\n#     Either way, certificates\
      \ persist in the caddy_data volume so they\n#     survive container restarts/recreations.\n#   install.sh enables HTTPS\
      \ by default and prompts for this address.\n# =============================================================================\n\
      \n{$SITE_ADDRESS::80} {\n\tencode gzip\n\n\tlog {\n\t\toutput stdout\n\t}\n\n\theader {\n\t\tX-Frame-Options \"DENY\"\
      \n\t\tX-Content-Type-Options \"nosniff\"\n\t\tReferrer-Policy \"strict-origin-when-cross-origin\"\n\t\tPermissions-Policy\
      \ \"camera=(), microphone=(), geolocation=()\"\n\t\tX-XSS-Protection \"0\"\n\t\t-Server\n\t}\n\n\t# Reject oversized\
      \ request bodies at the gateway before they reach\n\t# upstreams. Object storage uploads (handled below) are exempt.\n\
      \t@notStorage not path /storage/*\n\trequest_body @notStorage {\n\t\tmax_size 10MB\n\t}\n\n\t# -- Object storage (MinIO)\
      \ ------------------------------------------------\n\t#\n\t# The Host header is rewritten to the internal MinIO address\
      \ so that AWS\n\t# Signature V4 validation succeeds: MinIO re-derives the HMAC using the\n\t# Host it receives, which\
      \ must match the host that was used when the\n\t# presigned URL was generated (minio:9000).\n\t#\n\t# The API rewrites\
      \ presigned URL hosts from \"minio:9000\" to\n\t# STORAGE_PUBLIC_URL (e.g. \"http://localhost/storage\") before returning\n\
      \t# them to clients, so browsers always receive routable URLs.\n\thandle_path /storage/* {\n\t\treverse_proxy minio:9000\
      \ {\n\t\t\theader_up Host minio:9000\n\t\t}\n\t}\n\n\t# -- Realtime service (Socket.IO) ------------------------------------------\n\
      \t#\n\t# WebSocket upgrade requests are detected and proxied automatically.\n\t#\n\t# Client-side connection:\n\t# \
      \  io(\"http://localhost\", { path: \"/ws/socket.io\", withCredentials: true })\n\thandle_path /ws/* {\n\t\treverse_proxy\
      \ realtime:3001\n\t}\n\n\t# -- Local plugin frontend assets -------------------------------------------\n\t#\n\t# Serves\
      \ statically-built micro-frontend bundles for locally installed\n\t# plugins. Only plugins/local/frontend is mounted\
      \ here (plugins/local/backend\n\t# is mounted exclusively to the API container), so WASM binaries and SQL\n\t# migrations\
      \ are never reachable over HTTP.\n\t#\n\t# Set remoteEntryUrl in each plugin's plugin.json to:\n\t#   /plugins/<plugin-id>/assets/remoteEntry.js\n\
      \thandle_path /plugins/* {\n\t\troot * /var/www/plugins\n\n\t\t@wasm path *.wasm\n\t\theader @wasm Content-Type \"application/wasm\"\
      \n\n\t\t# Fingerprinted assets can be cached immutably for a long time.\n\t\theader Cache-Control \"public, max-age=900,\
      \ immutable\"\n\t\tfile_server\n\t}\n\n\t# -- MCP plugin bundles -------------------------------------------------------\n\
      \t#\n\t# Self-contained ESM bundles loaded at runtime by the MCP server. Kept on a\n\t# separate path from frontend\
      \ assets so WASM/CSS concerns from the block\n\t# above don't bleed into MCP serving.\n\t#\n\t# Set remoteEntryUrl in\
      \ each plugin's plugin.json mcp section to an\n\t# absolute URL, for example:\n\t#   ${PUBLIC_URL}/plugins-mcp/<plugin-id>/mcp.js\n\
      \thandle_path /plugins-mcp/* {\n\t\troot * /var/www/plugins-mcp\n\t\theader Cache-Control \"public, max-age=900, immutable\"\
      \n\t\tfile_server\n\t}\n\n\t# -- API routes ---------------------------------------------------------------\n\t#\n\t\
      # Forwards the /api prefix as-is to the upstream:\n\t#   /api/v1/users  \u2192  /api/v1/users\n\t#   /api/healthz  \
      \ \u2192  /api/healthz\n\thandle /api/* {\n\t\treverse_proxy api:8080\n\t}\n\n\t# -- Web application (SPA) -----------------------------------------------------\n\
      \t#\n\t# WebSocket upgrades are detected and proxied automatically, so Vite HMR\n\t# and any future realtime traffic\
      \ through this path work unmodified.\n\thandle {\n\t\treverse_proxy web:3000\n\t}\n}\n"
