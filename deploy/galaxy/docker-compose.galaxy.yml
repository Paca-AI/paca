# =============================================================================
# Galaxy production overlay for the Paca stack (Galaxy-Paca fork)
# =============================================================================
#
# Usage (on the prod host, from the repo root):
#
#   docker compose \
#     --env-file deploy/galaxy/.env.galaxy \
#     -f deploy/docker-compose.prod.yml \
#     -f deploy/galaxy/docker-compose.galaxy.yml \
#     up -d --scale ai-agent=0
#
# Design decisions:
#   - NO host port bindings. The Caddy gateway joins the external
#     galaxy_network under the alias `paca-gateway`; the Cloudflare tunnel
#     (galaxy-cloudflared-tunnel, same network) routes
#     https://tasks.skyplatform.net -> http://paca-gateway:80.
#   - TLS terminates at the Cloudflare edge; Caddy serves plain HTTP
#     (SITE_ADDRESS=:80). COOKIE_SECURE stays true because browsers only
#     ever see the HTTPS origin.
#   - Only the gateway is attached to galaxy_network; postgres/valkey/minio/
#     api/web/realtime stay on the stack-private default network.
#   - Database backups land on the host HDD via BACKUP_DIR=/backup/paca-postgres.
#   - Memory limits on every service (mem_limit + memswap_limit together —
#     see prod ops runbook).
#   - ai-agent stays scaled to 0 for now; its pre-shared keys must still be
#     set so the API side is never fail-open.  When it is enabled it reaches
#     Docker ONLY via the socket-proxy service below (DOCKER_HOST=tcp://…,
#     no docker.sock bind) and all LLM traffic is forced through the platform
#     proxy via LLM_BASE_URL_OVERRIDE (ADR-038).

name: galaxy-paca

services:
  postgres:
    mem_limit: 1g
    memswap_limit: 1g

  valkey:
    mem_limit: 512m
    memswap_limit: 512m

  minio:
    mem_limit: 1g
    memswap_limit: 1g

  api:
    environment:
      # ── ADR-038 P1: Vortex identity ────────────────────────────────────
      # OIDC SSO login (off unless OIDC_ISSUER is set).
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_AUTO_CREATE_USERS: ${OIDC_AUTO_CREATE_USERS:-true}
      OIDC_DEFAULT_ROLE: ${OIDC_DEFAULT_ROLE:-USER}
      OIDC_BUTTON_LABEL: ${OIDC_BUTTON_LABEL:-Sign in with Vortex}
      # Trusted-issuer RS256 bearer auth (act_as contract).
      GALAXY_TRUSTED_ISSUER: ${GALAXY_TRUSTED_ISSUER:-}
      # Extra iss claim values accepted on JWKS-verified bearers — identity's
      # mint-service-token stamps iss=galaxy-nexus (logical name), not the
      # discovery URL. Signature trust anchor unchanged.
      GALAXY_TRUSTED_ISSUER_CLAIMS: ${GALAXY_TRUSTED_ISSUER_CLAIMS:-}
      # Legacy X-Agent-ID header impersonation stays OFF; identity comes
      # from signed tokens only.
      AGENT_HEADER_IMPERSONATION: ${AGENT_HEADER_IMPERSONATION:-disabled}
      # ── ADR-038 P3.2: Galaxy chat dock ─────────────────────────────────
      # Advertised on the public /auth/config endpoint; the SPA mounts the
      # dock after login. Empty keeps the dock disabled.
      GALAXY_DOCK_SRC: ${GALAXY_DOCK_SRC:-}
    # Split-horizon OIDC (SỰ CỐ "invalid id_token" 17/07): identity mints
    # iss=http://nexus-identity:8086 (OIDC_ISSUER nội bộ của identity), nên
    # api phải fetch discovery/token/JWKS qua galaxy_network như RAGFlow.
    # ⚠️ Compose thêm alias ngầm = tên service (`api`) trên network chung —
    # đã scan 17/07: không container nào khác giữ alias `api`; nếu sau này
    # đụng, đổi tên service như vụ paca-edge.
    networks:
      default: {}
      galaxy_network:
        aliases:
          - paca-api
    mem_limit: 1g
    memswap_limit: 1g

  web:
    mem_limit: 256m
    memswap_limit: 256m

  realtime:
    mem_limit: 512m
    memswap_limit: 512m

  # Mediates the ai-agent's Docker access (ADR-038): the raw docker.sock is
  # mounted read-only HERE only, and ai-agent talks to it over tcp with just
  # the API surface a sandbox runner needs.  Stack-private network only.
  #
  # ⚠️ RETIRED 17/07 (ADR-038): the in-app OpenHands agent surface is replaced
  # by the platform ChatDock agent (assistant app_id=paca + galaxy-paca-mcp +
  # dock-trigger below — ADR-037 doctrine: agent surface = ChatDock). Both
  # sandbox services are profile-gated so a default `up` NEVER starts them
  # (same pattern as `gateway` above); upstream source stays untouched
  # (thin-fork rule: disable, don't delete). To resurrect temporarily:
  # `docker compose ... --profile retired-use-chatdock up -d`.
  socket-proxy:
    profiles: ["retired-use-chatdock"]
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      EXEC: 1
      VOLUMES: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      default: {}
    mem_limit: 128m
    memswap_limit: 128m

  ai-agent:
    # ⚠️ RETIRED 17/07 (ADR-038) — see socket-proxy note above. ChatDock is
    # the agent surface now; this stays defined-but-dormant per thin-fork rules.
    profiles: ["retired-use-chatdock"]
    # Docker access goes through socket-proxy — never mount docker.sock here.
    volumes: !override []
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      # ADR-038: force ALL LLM traffic through the platform proxy, overriding
      # whatever llm_base_url / API key individual agents carry in the DB.
      LLM_BASE_URL_OVERRIDE: ${LLM_BASE_URL_OVERRIDE:-}
      LLM_API_KEY_OVERRIDE: ${LLM_API_KEY_OVERRIDE:-}
      # ── ADR-038 T3: platform AI role routing ───────────────────────────
      # GALAXY_AI_ROLE (e.g. `paca-ai`) routes ALL LLM traffic through
      # identity /ai/v1 under that role (model rebindable in /nexus/admin →
      # AI Models, no redeploy) with per-conversation act_as tokens naming
      # the triggering user (billing attribution). Supersedes
      # LLM_BASE_URL_OVERRIDE. GALAXY_INTERNAL_SERVICE_SECRET = platform
      # INTERNAL_SERVICE_SECRET, referenced host-side from
      # ~/Nexus/Galaxy-Nexus/runtime/galaxy-shared/*.env — NEVER committed.
      GALAXY_AI_ROLE: ${GALAXY_AI_ROLE:-}
      GALAXY_AI_PROXY_URL: ${GALAXY_AI_PROXY_URL:-http://nexus-identity:8086/ai/v1}
      GALAXY_IDENTITY_URL: ${GALAXY_IDENTITY_URL:-}
      GALAXY_INTERNAL_SERVICE_SECRET: ${GALAXY_INTERNAL_SERVICE_SECRET:-}
      # Sandboxes make the LLM calls themselves (SDK ships the agent spec into
      # the agent-server) → they must join galaxy_network too. Spawned
      # containers have random names + no aliases: no DNS-collision surface.
      SANDBOX_EXTRA_NETWORKS: ${SANDBOX_EXTRA_NETWORKS:-}
    # galaxy_network for minting act_as tokens at nexus-identity + reaching
    # the AI proxy. ⚠️ Compose thêm alias ngầm = tên service (`ai-agent`)
    # trên network chung — đã scan 17/07: không container nào khác giữ alias
    # `ai-agent` hay `paca-ai-agent` (gần nhất: galaxy-ai-agent-service với
    # alias `ai_service` — khác tên). Nếu sau này đụng, đổi tên service như
    # vụ paca-edge. Alias tường minh `paca-ai-agent` là tên chính thức để
    # các stack khác trỏ tới.
    networks:
      default: {}
      galaxy_network:
        aliases:
          - paca-ai-agent
    depends_on:
      socket-proxy:
        condition: service_started
    mem_limit: 1g
    memswap_limit: 1g

  # ── Paca events → Galaxy notification inbox (ADR-038 P3.1) ────────────────
  # Tails Paca's task_assignments + plugin_events Valkey streams with its own
  # consumer group (galaxy-notify-bridge — never Paca's groups) and
  # republishes assigned/mentioned notifications to the platform notify
  # fan-out (notify.fan-out on the galaxy_network Redis), mapping Paca users
  # to Vortex subs via a READ-ONLY lookup on users.oidc_sub.
  # Joins BOTH networks: default (valkey/postgres) + galaxy_network (platform
  # Redis). Scale with env: it idles unless BRIDGE_ENABLED=true, and
  # `... up -d --scale notify-bridge=0` removes the container entirely.
  notify-bridge:
    build:
      # Relative paths resolve against the FIRST compose file's directory
      # (deploy/), not this overlay's — hence the galaxy/ segment.
      context: ./galaxy/notify-bridge
    restart: unless-stopped
    environment:
      BRIDGE_ENABLED: ${BRIDGE_ENABLED:-false}
      PACA_VALKEY_URL: ${PACA_VALKEY_URL:-redis://valkey:6379/0}
      PACA_DATABASE_URL: ${PACA_DATABASE_URL:-postgres://${POSTGRES_USER:-paca}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-paca}?sslmode=disable}
      GALAXY_NOTIFY_REDIS_URL: ${GALAXY_NOTIFY_REDIS_URL:-redis://agentops-redis:6379/0}
      NOTIFY_FANOUT_CHANNEL: ${NOTIFY_FANOUT_CHANNEL:-notify.fan-out}
      PACA_PUBLIC_URL: ${PUBLIC_URL:-https://tasks.skyplatform.net}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      valkey:
        condition: service_healthy
    networks:
      default: {}
      # agentops-redis (kênh notify.fan-out) nằm ở network riêng
      # agentops-redis-net, KHÔNG phải galaxy_network — vortex-notification
      # cũng join network này y hệt.
      agentops-redis-net: {}
    mem_limit: 256m
    memswap_limit: 256m

  # ── Paca events → ChatDock agent runs (ADR-038, thay ai-agent in-app) ─────
  # Same image as notify-bridge, own consumer group (galaxy-dock-agent): task
  # ASSIGNED to / @MENTION of a designated agent principal (Paca service user
  # `galaxy-tasks-agent`) → mint an RS256 token AS THE ASSIGNER/MENTIONER
  # (identity /internal/mint-service-token, sub = users.oidc_sub) → run the
  # AgentOps paca assistant via /api/chat/stream; the agent works the task
  # with paca_* tools and ALWAYS comments the result back. At-most-once
  # delivery (ack-before-dispatch). Idles unless DOCK_TRIGGER_ENABLED=true.
  # Networks: default (valkey/postgres) + agentops-redis-net (agentops-backend
  # :8090 listens there) + galaxy_network (nexus-identity mint).
  dock-trigger:
    build:
      context: ./galaxy/notify-bridge
    command: ["python", "-u", "dock_trigger.py"]
    restart: unless-stopped
    environment:
      DOCK_TRIGGER_ENABLED: ${DOCK_TRIGGER_ENABLED:-false}
      DOCK_AGENT_TRIGGER_USERNAMES: ${DOCK_AGENT_TRIGGER_USERNAMES:-galaxy-tasks-agent}
      AGENTOPS_URL: ${AGENTOPS_URL:-http://agentops-backend:8090}
      GALAXY_IDENTITY_URL: ${GALAXY_IDENTITY_URL:-http://nexus-identity:8086}
      GALAXY_INTERNAL_SERVICE_SECRET: ${GALAXY_INTERNAL_SERVICE_SECRET:-}
      DOCK_TRIGGER_TIMEOUT_S: ${DOCK_TRIGGER_TIMEOUT_S:-300}
      PACA_VALKEY_URL: ${PACA_VALKEY_URL:-redis://valkey:6379/0}
      PACA_DATABASE_URL: ${PACA_DATABASE_URL:-postgres://${POSTGRES_USER:-paca}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-paca}?sslmode=disable}
      PACA_PUBLIC_URL: ${PUBLIC_URL:-https://tasks.skyplatform.net}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      valkey:
        condition: service_healthy
    networks:
      default: {}
      agentops-redis-net: {}
      galaxy_network: {}
    mem_limit: 256m
    memswap_limit: 256m

  # ── SDD fleet data proxy (ADR-038) ────────────────────────────────────────
  # Same-origin /sdd-api/* backend for the NATIVE com.galaxy.sdd plugin. Caddy
  # (handle_path /sdd-api/*) forwards here; this sidecar gates each request on
  # the caller's Paca session (GET api:8080/api/v1/users/me), mints a short-
  # lived RS256 service token at nexus-identity /internal/mint-service-token
  # (iss=galaxy-nexus, like dock-trigger), and reverse-proxies GET reads to the
  # SDD Coordination Server (sdd-server:4830). Team-wide READ only; no secret
  # ever reaches the browser. Zero-dependency Node image (deploy/galaxy/sdd-proxy).
  # Networks: default (reach api:8080) + galaxy_network (reach nexus-identity +
  # sdd-server). Explicit alias paca-sdd-proxy avoids the implicit-name collision
  # class that forced the gateway→paca-edge rename.
  sdd-proxy:
    build:
      # Relative paths resolve against the FIRST compose file's dir (deploy/).
      context: ./galaxy/sdd-proxy
    restart: unless-stopped
    environment:
      PORT: ${SDD_PROXY_PORT:-8791}
      SDD_UPSTREAM_URL: ${SDD_UPSTREAM_URL:-http://sdd-server:4830}
      GALAXY_IDENTITY_URL: ${GALAXY_IDENTITY_URL:-http://nexus-identity:8086}
      PACA_AUTH_CHECK_URL: ${PACA_AUTH_CHECK_URL:-http://api:8080/api/v1/users/me}
      # RS256 mint auth (primary). Sourced host-side from the shared env; the
      # same secret ai-agent/dock-trigger use. NEVER committed.
      GALAXY_INTERNAL_SERVICE_SECRET: ${GALAXY_INTERNAL_SERVICE_SECRET:-}
      SDD_SERVICE_SUB: ${SDD_SERVICE_SUB:-svc-paca-sdd-fleet}
      SDD_SERVICE_AUD: ${SDD_SERVICE_AUD:-sdd-server}
      # Optional HS256 fallback (fleet-shared JWT_SECRET, which SDD also
      # accepts) — set only if you want the proxy to survive identity being
      # briefly unreachable. Left empty = RS256-only.
      SDD_SHARED_JWT_SECRET: ${SDD_SHARED_JWT_SECRET:-}
    networks:
      default: {}
      galaxy_network:
        aliases:
          - paca-sdd-proxy
    depends_on:
      api:
        condition: service_started
    mem_limit: 128m
    memswap_limit: 128m

  # ⚠️ SỰ CỐ 17/07: service upstream tên `gateway` sinh alias DNS NGẦM
  # `gateway` trên galaxy_network (Compose luôn thêm alias = tên service),
  # đụng alias `gateway` của vortex-gateway → tunnel round-robin đưa traffic
  # portal (ai.skyplatform.net) sang Paca. Vô hiệu service này bằng profile
  # và thay bằng `paca-edge` bên dưới (config copy đủ từ base + phần Galaxy).
  gateway:
    profiles: ["disabled-name-collides-with-vortex-gateway"]

  paca-edge:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # ── ADR-038 P3.2: Galaxy chat dock bridge ──────────────────────────
      # Platform gateway origin the Caddyfile galaxy_dock_bridge snippet
      # streams /dock.js + /api/agentops* + /api/identity* through to, over
      # galaxy_network (origin only — scheme://host[:port], no path).
      GALAXY_GATEWAY_URL: ${GALAXY_GATEWAY_URL:-http://vortex-gateway}
    volumes:
      # Relative paths resolve against the FIRST compose file's dir (deploy/).
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_plugins:/var/www/plugins:ro
      - mcp_plugins:/var/www/plugins-mcp:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
        required: false
      realtime:
        condition: service_started
      sdd-proxy:
        condition: service_started
    # Reachable only through galaxy_network (Cloudflare tunnel), never via
    # host ports. GATEWAY_NETWORK_ALIAS parameterizes the DNS name for
    # instance-per-tenant deploys (ADR-038 T7: paca-<tenant>-gateway).
    # Alias `gateway` on the STACK network only: the base compose points
    # ai-agent (GATEWAY_BASE_URL) and sandbox MCP bundle URLs at
    # http://gateway, which stopped resolving when the `gateway` service was
    # profile-disabled above — the alias restores that contract without
    # touching galaxy_network (where `gateway` belongs to vortex-gateway).
    networks:
      default:
        aliases:
          - gateway
      galaxy_network:
        aliases:
          - ${GATEWAY_NETWORK_ALIAS:-paca-gateway}
    mem_limit: 256m
    memswap_limit: 256m

networks:
  galaxy_network:
    external: true
  agentops-redis-net:
    external: true
