# E2E test stack – mirrors the production topology with fixed, test-safe
# credentials.  All secrets are intentionally weak and public; never use
# these values outside of a local E2E environment.
#
# Valkey is unauthenticated here for the same reason: test-only, never exposed.
#
# Usage (from repo root):
#   docker compose -f deploy/docker-compose.e2e.yml up -d --build --wait
#   docker compose -f deploy/docker-compose.e2e.yml down -v

name: paca-e2e

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paca
      POSTGRES_USER: paca
      POSTGRES_PASSWORD: e2e-postgres-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paca -d paca"]
      interval: 5s
      timeout: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --appendonly yes
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: paca-api:e2e
    build:
      context: ../services/api
    restart: unless-stopped
    environment:
      ENV: test
      PORT: "8080"
      DATABASE_URL: postgres://paca:e2e-postgres-password@postgres:5432/paca?sslmode=disable
      REDIS_URL: redis://valkey:6379/0
      JWT_SECRET: e2e-jwt-secret-not-for-production
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 168h
      COOKIE_SECURE: "false"
      # Every test logs in from the same IP; the per-IP auth limit would trip.
      AUTH_RATE_LIMIT_PER_MINUTE: "0"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: e2e-admin-password
      STORAGE_PROVIDER: rustfs
      STORAGE_ENDPOINT: rustfs:9000
      STORAGE_PUBLIC_URL: http://localhost/storage
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: paca
      STORAGE_ACCESS_KEY_ID: e2e-rustfs-access-key
      STORAGE_SECRET_ACCESS_KEY: e2e-rustfs-secret-key
      STORAGE_USE_SSL: "false"
      # Encryption key for sensitive values (plugin tokens/secrets).
      ENCRYPTION_KEY: "3b4a93a4f2ffa732a5f7cf44b9a37050e49f5f9c3f105c3995432b9dd49e28ac"
      # Public base URL used by plugins to generate callback/webhook URLs.
      PUBLIC_URL: http://localhost
      # Voice and video calls (the livekit service below). Calls stay off
      # until LIVEKIT_URL and a key/secret are set. LIVEKIT_URL (the signalling URL, derived from PUBLIC_URL when empty)
      # browsers use (through the gateway's /livekit route).
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      LIVEKIT_API_KEY: e2ekey
      LIVEKIT_API_SECRET: e2esecret-e2esecret-e2esecret-0123456789
      # Call recording: true once the egress service runs (--profile recording).
      LIVEKIT_EGRESS_ENABLED: ${LIVEKIT_EGRESS_ENABLED:-false}
      MEETING_AGENT_TOKEN: e2e-meeting-agent-token
      # Base URL of the agent-runner service. Explicit rather than relying
      # on the Go code's own http://ai-agent:8080 default — see
      # docker-compose.dev.yml's identical note for why that default no
      # longer resolves to anything now that ai-agent has been removed.
      AI_AGENT_URL: http://agent-runner:8080
      # Authenticates the reverse direction: API calling into agent-runner's
      # internal-only routes. Must match INTERNAL_API_KEY in the agent-runner service.
      AI_AGENT_INTERNAL_KEY: e2e-internal-api-key
      # Plugin subsystem — load WASM binaries + migrations from the local plugin store.
      # "local" keeps plugins in the folders below; "s3" stores them in the
      # STORAGE_* bucket instead (the gateway reads PLUGINS_STORE too, to route
      # /plugins/* through the API). The *_DIR settings are ignored in s3 mode.
      PLUGINS_STORE: ${PLUGINS_STORE:-local}
      PLUGINS_WASM_DIR: /plugins
      PLUGINS_FRONTEND_DIR: /plugins-frontend
      PLUGINS_MCP_DIR: /plugins-mcp
      PLUGINS_SKILLS_DIR: /plugins-skills
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    volumes:
      # Backend plugin store — WASM binaries and SQL migrations only.
      # Writable so the marketplace installer can download and extract artifacts.
      # Never mounted to the gateway, so the WASM files are not publicly reachable.
      - ../plugins/local/backend:/plugins
      # Frontend plugin store — built JS bundles, served at /plugins/.
      # Writable for API marketplace installs; also mounted read-only by the gateway.
      - ../plugins/local/frontend:/plugins-frontend
      # MCP plugin store — self-contained ESM bundles, served at /plugins-mcp/.
      # Writable for API marketplace installs; also mounted read-only by the gateway.
      - ../plugins/local/mcp:/plugins-mcp
      # Skills plugin store — SKILL.md bundles, served at /plugins-skills/.
      # Writable for API marketplace installs; also mounted read-only by the gateway.
      - ../plugins/local/skills:/plugins-skills
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null -T 3 --tries=1 http://127.0.0.1:8080/api/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20

  web:
    image: paca-web:e2e
    build:
      context: ../apps/web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null -T 3 --tries=1 http://127.0.0.1:3000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  realtime:
    image: paca-realtime:e2e
    build:
      context: ../services/realtime
    restart: unless-stopped
    environment:
      PORT: "3001"
      NODE_ENV: test
      API_URL: http://api:8080
      REDIS_URL: redis://valkey:6379/0
      CORS_ORIGINS: http://localhost
      LOG_LEVEL: debug
    depends_on:
      valkey:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null -T 3 --tries=1 http://127.0.0.1:3001/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Mock OpenID Connect provider for the SSO specs (apps/e2e/tests/admin/
  # sso.spec.ts). interactiveLogin serves a form where a spec types any
  # subject and claims. The API reaches it as http://mock-oidc:9090 (the
  # issuer is taken from the Host header, so that is the issuer too); the
  # browser can't resolve "mock-oidc", so the spec proxies those requests to
  # the published port with page.route.
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    restart: unless-stopped
    environment:
      SERVER_PORT: "9090"
      JSON_CONFIG: '{"interactiveLogin": true}'
    ports:
      - "9090:9090"

  # ── LiveKit (opt-in voice and video calls) ───────────────────────────────────
  # Voice and video calls. Media uses UDP 7882 and TCP 7881 on the host;
  # signalling goes through the gateway's /livekit route.
  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    # Its config points at Valkey (needed by the egress service for recordings).
    depends_on:
      valkey:
        condition: service_started
    environment:
      LIVEKIT_KEYS: "e2ekey: e2esecret-e2esecret-e2esecret-0123456789"
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          # Must be reachable from the egress container too (call recording): set
          # LIVEKIT_NODE_IP to the machine's LAN or public IP when you record.
          node_ip: ${LIVEKIT_NODE_IP:-127.0.0.1}
        redis:
          address: valkey:6379
        webhook:
          api_key: e2ekey
          urls:
            - http://api:8080/api/v1/webhooks/livekit
    ports:
      # Media bypasses the gateway: one muxed UDP port plus a TCP fallback.
      - "${LIVEKIT_TCP_PORT:-7881}:7881/tcp"
      - "${LIVEKIT_UDP_PORT:-7882}:7882/udp"

  # ── LiveKit egress (opt-in call recording: docker compose --profile recording up) ──
  # Composes a call into one MP4 and uploads it to the object-store bucket the API
  # uses. Needs LiveKit's Redis block (above), LIVEKIT_EGRESS_ENABLED=true on the
  # API, and SYS_ADMIN for its headless Chrome. The image is large (about 4 GB).
  egress:
    profiles: ["recording"]
    image: livekit/egress:v1.15.0
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    depends_on:
      - livekit
      - valkey
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: e2ekey
        api_secret: e2esecret-e2esecret-e2esecret-0123456789
        ws_url: ws://livekit:7880
        # The egress browser loads its page over https and talks to LiveKit on the
        # compose network over ws://, which Chrome refuses unless told otherwise.
        insecure: true
        health_port: 8083
        redis:
          address: valkey:6379

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # Must match the API's PLUGINS_STORE: "s3" makes the gateway forward
      # /plugins/*, /plugins-mcp/* and /plugins-skills/* to the API instead of
      # serving the plugin folders below.
      PLUGINS_STORE: ${PLUGINS_STORE:-local}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Frontend plugin store — built JS bundles, served at /plugins/.
      # Layout: /var/www/plugins/<plugin-id>/assets/remoteEntry.js
      - ../plugins/local/frontend:/var/www/plugins:ro
      # MCP plugin store — self-contained ESM bundles, served at /plugins-mcp/.
      # Layout: /var/www/plugins-mcp/<plugin-id>/mcp.js
      - ../plugins/local/mcp:/var/www/plugins-mcp:ro
      # Skills plugin store — SKILL.md bundles, served at /plugins-skills/.
      # Layout: /var/www/plugins-skills/<plugin-id>/<skill-name>/SKILL.md
      - ../plugins/local/skills:/var/www/plugins-skills:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      realtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null -T 3 --tries=1 http://127.0.0.1/api/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # A fresh Docker named volume is created root-owned, but the rustfs image
  # runs its main process as the unprivileged `rustfs` user (uid/gid 10001) —
  # writing to /data/rustfs0 then fails with "Permission denied (os error
  # 13)" (confirmed live). This one-shot init container fixes ownership
  # before rustfs starts; it reuses the same image so nothing extra is
  # pulled.
  rustfs-init:
    image: rustfs/rustfs:1.0.0-rc.6
    user: root
    entrypoint: ["/bin/sh", "-c", "chown -R 10001:10001 /data/rustfs0"]
    volumes:
      - rustfs_data:/data/rustfs0

  # RustFS — S3-compatible object store for E2E tests.
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.6
    restart: unless-stopped
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: e2e-rustfs-access-key
      RUSTFS_SECRET_KEY: e2e-rustfs-secret-key
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
    volumes:
      - rustfs_data:/data/rustfs0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  agent-runner:
    image: paca-agent-runner:e2e
    build:
      context: ../services/agent-runner
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VALKEY_URL: redis://valkey:6379/0
      DATABASE_URL: postgres://paca:e2e-postgres-password@postgres:5432/paca
      INTERNAL_API_KEY: e2e-internal-api-key
      PACA_API_URL: http://api:8080
      # Gateway base URL — the MCP server uses this to resolve plugin MCP bundle
      # URLs (e.g. /plugins-mcp/<id>/mcp.js).  The gateway (Caddy) serves these
      # files, not the API service.
      PACA_GATEWAY_URL: http://gateway:8080
      # Must match ENCRYPTION_KEY in the api service.
      ENCRYPTION_KEY: "3b4a93a4f2ffa732a5f7cf44b9a37050e49f5f9c3f105c3995432b9dd49e28ac"
      DOCKER_SOCKET: /var/run/docker.sock
      # For this local e2e stack, build a locally-tagged image before
      # starting this service (CD publishes ghcr.io/paca-ai/paca-agent-server-goose
      # from this same Dockerfile for real releases):
      #   docker build -f ../services/agent-server/Dockerfile \
      #     -t paca-agent-server-goose:e2e ../services/agent-server
      AGENT_SERVER_IMAGE: "paca-agent-server-goose:e2e"
      PORT_POOL_START: "10000"
      PORT_POOL_SIZE: "100"
      WORKER_CONCURRENCY: "5"
      CHAT_SANDBOX_IDLE_TIMEOUT_MINUTES: "3"
      AGENT_RUNNER_ALLOWED_AGENT_IDS: "*"
      LOG_LEVEL: info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres_data:
  valkey_data:
  rustfs_data:
