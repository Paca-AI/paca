# E2E test stack – mirrors the production topology with fixed, test-safe
# credentials.  All secrets are intentionally weak and public; never use
# these values outside of a local E2E environment.
#
# Usage (from repo root):
#   docker compose -f deploy/docker-compose.e2e.yml up -d --build --wait
#   docker compose -f deploy/docker-compose.e2e.yml down -v

name: paca-e2e

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paca
      POSTGRES_USER: paca
      POSTGRES_PASSWORD: e2e-postgres-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../services/api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paca -d paca"]
      interval: 5s
      timeout: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --appendonly yes
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: paca-api:e2e
    build:
      context: ../services/api
    restart: unless-stopped
    environment:
      ENV: test
      PORT: "8080"
      DATABASE_URL: postgres://paca:e2e-postgres-password@postgres:5432/paca?sslmode=disable
      REDIS_URL: redis://valkey:6379/0
      JWT_SECRET: e2e-jwt-secret-not-for-production
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 168h
      COOKIE_SECURE: "false"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: e2e-admin-password
      STORAGE_PROVIDER: minio
      STORAGE_ENDPOINT: minio:9000
      STORAGE_PUBLIC_URL: http://localhost/storage
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: paca
      STORAGE_ACCESS_KEY_ID: e2e-minio-access-key
      STORAGE_SECRET_ACCESS_KEY: e2e-minio-secret-key
      STORAGE_USE_SSL: "false"
      # Encryption key for sensitive values (plugin tokens/secrets).
      ENCRYPTION_KEY: "3b4a93a4f2ffa732a5f7cf44b9a37050e49f5f9c3f105c3995432b9dd49e28ac"
      # Public base URL used by plugins to generate callback/webhook URLs.
      PUBLIC_URL: http://localhost
      # Pre-shared key for the agent-runner service to authenticate with the API.
      # Must match PACA_API_KEY in the agent-runner service.
      AGENT_API_KEY: e2e-agent-api-key
      # Base URL of the agent-runner service. Explicit rather than relying
      # on the Go code's own http://ai-agent:8080 default — see
      # docker-compose.dev.yml's identical note for why that default no
      # longer resolves to anything now that ai-agent has been removed.
      AI_AGENT_URL: http://agent-runner:8080
      # Authenticates the reverse direction: API calling into agent-runner's
      # internal-only routes. Must match INTERNAL_API_KEY in the agent-runner service.
      AI_AGENT_INTERNAL_KEY: e2e-internal-api-key
      # Plugin subsystem — load WASM binaries + migrations from the local plugin store.
      PLUGINS_WASM_DIR: /plugins
      PLUGINS_FRONTEND_DIR: /plugins-frontend
      PLUGINS_MCP_DIR: /plugins-mcp
      PLUGINS_SKILLS_DIR: /plugins-skills
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      # Backend plugin store — WASM binaries and SQL migrations only.
      # Writable so the marketplace installer can download and extract artifacts.
      # Never mounted to the gateway, so the WASM files are not publicly reachable.
      - ../plugins/local/backend:/plugins
      # Frontend plugin store — built JS bundles, served at /plugins/.
      # Writable for API marketplace installs; also mounted read-only by the gateway.
      - ../plugins/local/frontend:/plugins-frontend
      # MCP plugin store — self-contained ESM bundles, served at /plugins-mcp/.
      # Writable for API marketplace installs; also mounted read-only by the gateway.
      - ../plugins/local/mcp:/plugins-mcp
      # Skills plugin store — SKILL.md bundles, served at /plugins-skills/.
      # Writable for API marketplace installs; also mounted read-only by the gateway.
      - ../plugins/local/skills:/plugins-skills
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null -T 3 --tries=1 http://127.0.0.1:8080/api/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20

  web:
    image: paca-web:e2e
    build:
      context: ../apps/web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null -T 3 --tries=1 http://127.0.0.1:3000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  realtime:
    image: paca-realtime:e2e
    build:
      context: ../services/realtime
    restart: unless-stopped
    environment:
      PORT: "3001"
      NODE_ENV: test
      API_URL: http://api:8080
      REDIS_URL: redis://valkey:6379/0
      CORS_ORIGINS: http://localhost
      LOG_LEVEL: debug
    depends_on:
      valkey:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null -T 3 --tries=1 http://127.0.0.1:3001/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Frontend plugin store — built JS bundles, served at /plugins/.
      # Layout: /var/www/plugins/<plugin-id>/assets/remoteEntry.js
      - ../plugins/local/frontend:/var/www/plugins:ro
      # MCP plugin store — self-contained ESM bundles, served at /plugins-mcp/.
      # Layout: /var/www/plugins-mcp/<plugin-id>/mcp.js
      - ../plugins/local/mcp:/var/www/plugins-mcp:ro
      # Skills plugin store — SKILL.md bundles, served at /plugins-skills/.
      # Layout: /var/www/plugins-skills/<plugin-id>/<skill-name>/SKILL.md
      - ../plugins/local/skills:/var/www/plugins-skills:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      realtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null -T 3 --tries=1 http://127.0.0.1/api/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # MinIO — S3-compatible object store for E2E tests.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: e2e-minio-access-key
      MINIO_ROOT_PASSWORD: e2e-minio-secret-key
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  agent-runner:
    image: paca-agent-runner:e2e
    build:
      context: ../services/agent-runner
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VALKEY_URL: redis://valkey:6379/0
      DATABASE_URL: postgres://paca:e2e-postgres-password@postgres:5432/paca
      INTERNAL_API_KEY: e2e-internal-api-key
      PACA_API_URL: http://api:8080
      # Gateway base URL — the MCP server uses this to resolve plugin MCP bundle
      # URLs (e.g. /plugins-mcp/<id>/mcp.js).  The gateway (Caddy) serves these
      # files, not the API service.
      PACA_GATEWAY_URL: http://gateway:8080
      # Must match AGENT_API_KEY in the api service.
      PACA_API_KEY: e2e-agent-api-key
      # Must match ENCRYPTION_KEY in the api service.
      ENCRYPTION_KEY: "3b4a93a4f2ffa732a5f7cf44b9a37050e49f5f9c3f105c3995432b9dd49e28ac"
      DOCKER_SOCKET: /var/run/docker.sock
      # For this local e2e stack, build a locally-tagged image before
      # starting this service (CD publishes ghcr.io/paca-ai/paca-agent-server-goose
      # from this same Dockerfile for real releases — see
      # docs/ai-agent/goose-migration.md's Dev Environment Wiring section):
      #   docker build -f ../services/agent-server/Dockerfile \
      #     -t paca-agent-server-goose:e2e ../services/agent-server
      AGENT_SERVER_IMAGE: "paca-agent-server-goose:e2e"
      PORT_POOL_START: "10000"
      PORT_POOL_SIZE: "100"
      WORKER_CONCURRENCY: "5"
      CHAT_SANDBOX_IDLE_TIMEOUT_MINUTES: "3"
      AGENT_RUNNER_ALLOWED_AGENT_IDS: "*"
      LOG_LEVEL: info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres_data:
  valkey_data:
  minio_data:
