apiVersion: v2
name: paca
description: Paca — self-hosted AI-powered project management, deployed on Kubernetes.
type: application
version: 0.1.0
# Tracks the latest Paca release these defaults were verified against —
# bump alongside deploy/docker-compose.prod.yml's own image tags, not
# independently. See .github/workflows/cd.yml for where these images are
# published.
appVersion: "latest"
home: https://github.com/Paca-AI/paca
icon: https://raw.githubusercontent.com/Paca-AI/paca/master/docs/assets/paca-logo.svg
sources:
  - https://github.com/Paca-AI/paca
# rustfs's own chart always keeps version == appVersion (see
# https://charts.rustfs.com/index.yaml), so pinning the dependency version
# here is also what pins the deployed RustFS image — values.yaml deliberately
# leaves rustfs.image.rustfs.tag empty to inherit it from here instead of
# pinning the same version a second, independently-driftable time. Bump this
# alongside the "image" note above when upgrading RustFS.
dependencies:
  - name: rustfs
    version: "1.0.0-rc.6"
    repository: https://charts.rustfs.com
    condition: rustfs.enabled
keywords:
  - project-management
  - ai-agents
  - self-hosted
maintainers:
  - name: Paca AI
    url: https://github.com/Paca-AI
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/Paca-AI/paca/blob/master/deploy/helm/README.md
