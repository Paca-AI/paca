{{/*
Grants agent-runner exactly what internal/sandbox/k8s needs to run the AI
agent sandbox: one Kubernetes Job per ephemeral conversation
(create/get/list/watch/delete on batch/jobs), plus one apps/Deployment and
one PersistentVolumeClaim per static environment (see
internal/sandbox/k8s/environment.go and
docs/ai-agent/environment-management.md) — a Deployment's declarative
replicas is what StartEnvironment/StopEnvironment patch between 1 and 0,
and "patch" is granted alongside create/get/list/watch/delete for exactly
that. Also get/list/watch on pods (finding a Job's or a Deployment's
current Pod and its IP/status), the pods/log and pods/exec subresources
(diagnostics on a failed start, and the CopyToContainer/Exec/
CopyToEnvironment/ExecEnvironment/StreamExecEnvironment operations
executor.go and the browser terminal rely on), and one NodePort Service
per static environment that has SSH access and/or a user-added port
forward configured (ensureEnvironmentService — publishes those ports
directly rather than relaying them through agent-runner's own process;
see docs/ai-agent/environment-management.md's "Terminal / SSH Access" and
"Port Forwarding" sections). Scoped to exactly the sandbox namespace (see
paca.sandboxNamespace) — no cluster-scoped permissions, and no access to
any other resource type (Secrets, other Deployments/PVCs/Services not
created by this ServiceAccount, etc.) in that namespace either.
*/}}
{{- if and .Values.agentRunner.enabled (eq .Values.agentRunner.sandbox.backend "kubernetes") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "paca.fullname" . }}-agent-runner-sandbox
  namespace: {{ include "paca.sandboxNamespace" . }}
  labels:
    {{- include "paca.componentLabels" (dict "root" . "component" "agent-runner") | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
{{- end }}
