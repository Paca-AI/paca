{{- if .Values.agentRunner.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "paca.fullname" . }}-agent-runner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "paca.componentLabels" (dict "root" . "component" "agent-runner") | nindent 4 }}
spec:
  selector:
    {{- include "paca.selectorLabels" (dict "root" . "component" "agent-runner") | nindent 4 }}
  ports:
    - port: 8080
      targetPort: http
      name: http
{{- end }}
