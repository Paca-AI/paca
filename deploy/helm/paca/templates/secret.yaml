{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paca.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "paca.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret is required" .Values.secrets.jwtSecret | quote }}
  ADMIN_PASSWORD: {{ required "secrets.adminPassword is required" .Values.secrets.adminPassword | quote }}
  ENCRYPTION_KEY: {{ required "secrets.encryptionKey is required (64 hex characters)" .Values.secrets.encryptionKey | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | default "" | quote }}
  STORAGE_ACCESS_KEY_ID: {{ .Values.secrets.storageAccessKeyId | default "" | quote }}
  STORAGE_SECRET_ACCESS_KEY: {{ .Values.secrets.storageSecretAccessKey | default "" | quote }}
  DATABASE_URL: {{ include "paca.databaseUrl" . | quote }}
  REDIS_URL: {{ include "paca.redisUrl" . | quote }}
  {{- if .Values.agentRunner.enabled }}
  INTERNAL_API_KEY: {{ required "secrets.internalApiKey is required when agentRunner.enabled" .Values.secrets.internalApiKey | quote }}
  AGENT_API_KEY: {{ required "secrets.agentApiKey is required when agentRunner.enabled" .Values.secrets.agentApiKey | quote }}
  {{- end }}
{{- end }}
