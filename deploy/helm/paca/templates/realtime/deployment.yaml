apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "paca.fullname" . }}-realtime
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "paca.componentLabels" (dict "root" . "component" "realtime") | nindent 4 }}
spec:
  replicas: {{ .Values.realtime.replicaCount }}
  selector:
    matchLabels:
      {{- include "paca.selectorLabels" (dict "root" . "component" "realtime") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "paca.componentLabels" (dict "root" . "component" "realtime") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: realtime
          image: "{{ .Values.realtime.image.repository }}:{{ .Values.realtime.image.tag }}"
          imagePullPolicy: {{ .Values.realtime.image.pullPolicy }}
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
            - name: API_URL
              value: "http://{{ include "paca.fullname" . }}-api:8080"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "paca.secretName" . }}
                  key: REDIS_URL
            - name: CORS_ORIGINS
              value: {{ default (default "http://localhost" .Values.publicUrl) .Values.realtime.corsOrigins | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.realtime.logLevel | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.realtime.resources | nindent 12 }}
