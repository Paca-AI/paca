{{- if .Values.valkey.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "paca.fullname" . }}-valkey
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "paca.componentLabels" (dict "root" . "component" "valkey") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "paca.selectorLabels" (dict "root" . "component" "valkey") | nindent 4 }}
  ports:
    - port: 6379
      targetPort: valkey
      name: valkey
{{- end }}
